services:
  - type: web
    name: balancevault-backend
    env: node
    plan: starter
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neon-db
          property: connectionString
      - key: NODE_ENV
        value: production
